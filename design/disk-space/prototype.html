<title>USB Link 磁碟空間</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one app window. Toolbar over a fluid treemap, a 320px inspector on the right, a status bar below.
   Tokens restate desktop/Theme/Palette.cs (Windows 11 light/dark, accent blue of the USB Link icon). */
:root{
  --window:#F3F3F3; --surface:#FFFFFF; --card:#FFFFFFB3; --field:#F9F9F9; --control:#FDFDFD;
  --stroke:#0000001A; --stroke-strong:#00000026; --ink:#1B1B1B; --muted:#5C5C5C; --subtle:#8A8A8A;
  --accent:#0F6CBD; --accent-soft:#E6F0FA; --accent-ink:#FFFFFF; --ok:#107C10; --warn:#9D5D00; --err:#C42B1C; --err-soft:#FDE7E9;
  --map-bg:#E9EBEE; --shadow:0 18px 50px -12px #00000040, 0 2px 8px #00000014;
  --age-new:#1E88E5; --age-old:#8793A3;
  --c-video:#C4452F; --c-audio:#B7791F; --c-image:#0E8A82; --c-doc:#2F6FD1; --c-arch:#7A5BC4;
  --c-code:#3E8E3A; --c-app:#1C86B8; --c-disk:#B8408B; --c-sys:#5E6B7C; --c-other:#7D8794;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei UI","Microsoft JhengHei",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --window:#202020; --surface:#2B2B2B; --card:#FFFFFF0D; --field:#FFFFFF08; --control:#FFFFFF0F;
  --stroke:#FFFFFF17; --stroke-strong:#FFFFFF29; --ink:#FFFFFF; --muted:#C8C8C8; --subtle:#9A9A9A;
  --accent:#4CC2FF; --accent-soft:#1F3446; --accent-ink:#0B2230; --ok:#6CCB5F; --warn:#FCE100; --err:#FF99A4; --err-soft:#442726;
  --map-bg:#181A1D; --shadow:0 18px 50px -12px #000000AA, 0 2px 8px #00000066;
  --age-new:#4CC2FF; --age-old:#4A5260;
  --c-video:#D9573F; --c-audio:#C98A2B; --c-image:#1AA39A; --c-doc:#4A86E8; --c-arch:#8F72DA;
  --c-code:#4FA24A; --c-app:#2E9BD0; --c-disk:#CF55A2; --c-sys:#718096; --c-other:#8A94A3; color-scheme:dark}}
:root[data-theme="dark"]{
  --window:#202020; --surface:#2B2B2B; --card:#FFFFFF0D; --field:#FFFFFF08; --control:#FFFFFF0F;
  --stroke:#FFFFFF17; --stroke-strong:#FFFFFF29; --ink:#FFFFFF; --muted:#C8C8C8; --subtle:#9A9A9A;
  --accent:#4CC2FF; --accent-soft:#1F3446; --accent-ink:#0B2230; --ok:#6CCB5F; --warn:#FCE100; --err:#FF99A4; --err-soft:#442726;
  --map-bg:#181A1D; --shadow:0 18px 50px -12px #000000AA, 0 2px 8px #00000066;
  --age-new:#4CC2FF; --age-old:#4A5260;
  --c-video:#D9573F; --c-audio:#C98A2B; --c-image:#1AA39A; --c-doc:#4A86E8; --c-arch:#8F72DA;
  --c-code:#4FA24A; --c-app:#2E9BD0; --c-disk:#CF55A2; --c-sys:#718096; --c-other:#8A94A3; color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--window);color:var(--ink);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;max-width:1360px;margin:0 auto;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--stroke);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;min-height:560px}
.title{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;font-size:12px;color:var(--muted)}
.title .dot{width:16px;height:16px;border-radius:5px;background:linear-gradient(135deg,var(--accent),#7AD0FF)}
.title .sp{flex:1}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;border-radius:6px;padding:6px 8px;color:var(--muted);transition:background .15s,color .15s}
.ghost:hover{background:var(--control);color:var(--ink)}
.ghost[disabled]{opacity:.4;pointer-events:none}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 14px 12px;border-bottom:1px solid var(--stroke)}
.nav{display:flex;gap:2px}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:1 1 220px;overflow:hidden;padding:4px 6px;border-radius:8px;background:var(--field);border:1px solid var(--stroke)}
.crumb{border:0;background:transparent;padding:3px 7px;border-radius:5px;white-space:nowrap;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
.crumb:hover{background:var(--control);color:var(--ink)}
.crumb:last-child{color:var(--ink);font-weight:600}
.crumbs .sep{color:var(--subtle);font-size:11px}
.search{position:relative;flex:0 1 300px;min-width:180px}
.search input{width:100%;height:34px;padding:0 30px 0 32px;border-radius:8px;border:1px solid var(--stroke);background:var(--field);color:var(--ink);font:inherit;transition:border-color .15s,box-shadow .15s}
.search input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.search .ic{position:absolute;left:10px;top:9px;color:var(--subtle)}
.search .x{position:absolute;right:4px;top:4px;padding:5px;border-radius:5px}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--field);border:1px solid var(--stroke);position:relative}
.seg button{position:relative;z-index:1;border:0;background:transparent;padding:5px 12px;border-radius:6px;color:var(--muted);transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.seg .pill{position:absolute;top:2px;bottom:2px;border-radius:6px;background:var(--surface);box-shadow:0 1px 3px #0003,0 0 0 1px var(--stroke);transition:left .3s var(--ease),width .3s var(--ease)}
.detail{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.detail input{width:96px;accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:6px 14px;border-radius:6px;border:1px solid var(--stroke);background:var(--control);transition:transform .15s,background .15s,box-shadow .15s}
.btn:hover{background:var(--card);box-shadow:0 2px 8px #0002}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.err{background:var(--err-soft);color:var(--err)}
.hint{width:100%;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;min-height:18px}

/* scan progress */
.prog{height:3px;background:transparent;position:relative;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--accent),#7AD0FF);transition:width .25s linear,opacity .5s}
.prog i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff8,transparent);animation:sweep 1.2s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0;flex:1 1 0}
.mapwrap{position:relative;min-height:0;padding:10px;background:var(--map-bg);display:flex}
#map{position:relative;flex:1;min-width:0;overflow:hidden;border-radius:8px}
.cell{position:absolute;border-radius:6px;overflow:hidden;cursor:default;--cat:var(--c-other);
  transition:left .55s var(--ease),top .55s var(--ease),width .55s var(--ease),height .55s var(--ease),opacity .35s,filter .2s,box-shadow .2s,transform .2s;
  animation:pop .5s var(--ease) backwards}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.cell.gone{opacity:0;transform:scale(.96);pointer-events:none;animation:none}
.cell.dir{background:color-mix(in srgb,var(--cat) 15%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cat) 38%,transparent)}
.cell.file,.cell.dir.dirleaf{background:linear-gradient(150deg,color-mix(in srgb,var(--cat) 92%,#fff),color-mix(in srgb,var(--cat) 86%,#000));color:#fff;box-shadow:none}
.cell.dir.dirleaf{background:linear-gradient(150deg,color-mix(in srgb,var(--cat) 70%,var(--surface)),color-mix(in srgb,var(--cat) 62%,var(--surface)))}
.cell.agg{background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--ink) 8%,transparent) 5px 6px),color-mix(in srgb,var(--cat) 14%,var(--surface));color:var(--muted);box-shadow:inset 0 0 0 1px var(--stroke)}
.cell.agg .lb{text-shadow:none}
.cell.free{background:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--ink) 7%,transparent) 7px 8px),var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--stroke-strong)}
.map.age .cell.file,.map.age .cell.dirleaf{background:linear-gradient(150deg,color-mix(in oklab,var(--age-new),var(--age-old) calc(var(--age)*100%)),color-mix(in oklab,var(--age-new),var(--age-old) calc(var(--age)*100%)) )}
.map.age .cell.dir:not(.dirleaf){background:color-mix(in srgb,var(--surface) 88%,var(--ink));box-shadow:inset 0 0 0 1px var(--stroke-strong)}
.cell:not(.free):not(.gone):hover{filter:brightness(1.12) saturate(1.1);z-index:50!important;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent),0 10px 26px #0006}
.cell.dir:not(.gone):hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cat) 60%,transparent),0 0 0 2px var(--accent);z-index:auto!important;filter:none}
.cell.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)!important;z-index:60!important}
.cell.dir.sel{box-shadow:inset 0 0 0 2px var(--accent)!important;z-index:auto!important}
.cell.dim{opacity:.16;filter:saturate(.3)}
.cell.scanning::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff3 50%,transparent 70%);animation:sweep 1.4s linear infinite;pointer-events:none}
.hd{position:absolute;inset:0 0 auto 0;height:22px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.hd::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--cat);flex:none}
.hd .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.hd .sz{margin-left:auto;color:var(--muted);font-weight:400;font-size:11px}
.lb{position:absolute;inset:0;padding:6px 8px;display:flex;flex-direction:column;gap:1px;font-size:12px;line-height:1.25;text-shadow:0 1px 2px #0004}
.lb b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb span{opacity:.82;font-size:11px;white-space:nowrap}
.cell.free .lb{text-shadow:none}
.mapcover{position:absolute;inset:10px;border-radius:8px;display:none;pointer-events:none}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--stroke-strong);border-radius:8px;padding:9px 11px;box-shadow:var(--shadow);font-size:12px;min-width:190px;max-width:300px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip .t{font-weight:600;word-break:break-all;margin-bottom:4px;display:flex;gap:7px;align-items:center}
.tip .t i{width:9px;height:9px;border-radius:3px;background:var(--cat);flex:none}
.tip dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;color:var(--muted)}
.tip dd{margin:0;color:var(--ink);text-align:right}

/* inspector */
.insp{border-left:1px solid var(--stroke);padding:16px;display:flex;flex-direction:column;gap:16px;overflow:auto;min-height:0;background:var(--surface)}
.insp h3{margin:0;font-size:11px;font-weight:600;color:var(--subtle);letter-spacing:.06em;text-transform:uppercase}
.sel-card{display:flex;flex-direction:column;gap:6px}
.sel-card .nm{font-size:16px;font-weight:600;display:flex;gap:8px;align-items:center;word-break:break-all}
.sel-card .nm i{width:10px;height:10px;border-radius:3px;flex:none;background:var(--cat)}
.sel-card .path{color:var(--muted);font-size:12px;word-break:break-all}
.big{font-size:28px;font-weight:600;letter-spacing:-.02em}
.meter{height:6px;border-radius:9px;background:var(--field);box-shadow:inset 0 0 0 1px var(--stroke);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .6s var(--ease)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;color:var(--muted)}
.kv dd{margin:0;color:var(--ink);text-align:right}
.stack{display:flex;height:12px;border-radius:7px;overflow:hidden;gap:2px;background:var(--field)}
.stack i{display:block;height:100%;min-width:3px;background:var(--cat);transition:flex-grow .6s var(--ease),opacity .2s}
.legend{display:flex;flex-direction:column;gap:2px}
.lg{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:5px 8px;border-radius:6px;border:0;background:transparent;text-align:left;transition:background .15s,opacity .2s}
.lg:hover{background:var(--field)}
.lg[aria-pressed="true"]{background:var(--accent-soft)}
.lg i{width:10px;height:10px;border-radius:3px;background:var(--cat)}
.lg span:last-child{color:var(--muted)}
.top{display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 8px;border-radius:6px;border:0;background:transparent;text-align:left;position:relative;overflow:hidden}
.row:hover{background:var(--field)}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sz{color:var(--muted)}
.row .bar2{grid-column:1/-1;height:3px;border-radius:3px;background:var(--cat);opacity:.8;transform-origin:left;width:calc(var(--w)*1%)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.empty{color:var(--subtle);text-align:center;padding:20px 8px}

/* status */
.status{display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 14px;border-top:1px solid var(--stroke);color:var(--muted);font-size:12px;align-items:center}
.status .sp{flex:1}
.free-meter{width:140px}

/* home */
.home{padding:36px clamp(16px,5vw,64px);overflow:auto;display:flex;flex-direction:column;gap:24px;flex:1 1 0;min-height:0}
.home h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em}
.home p{margin:4px 0 0;color:var(--muted);max-width:56ch}
.drives{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.drive{position:relative;text-align:left;border:1px solid var(--stroke);border-radius:12px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:12px;
  transition:transform .25s var(--ease),box-shadow .25s,border-color .2s;animation:pop .6s var(--ease) backwards;animation-delay:calc(var(--i)*70ms)}
.drive:hover{transform:translateY(-3px);box-shadow:0 14px 30px -10px #0004;border-color:var(--accent)}
.drive .top2{display:flex;align-items:center;gap:12px}
.drive .glyph{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.drive .nm{font-weight:600;font-size:14px}
.drive .sub{color:var(--muted);font-size:12px}
.drive .meter{height:8px}
.drive .meter i.warn{background:var(--warn)}
.drive .nums{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.drive.pick{border-style:dashed;align-items:center;justify-content:center;min-height:150px;color:var(--muted);gap:8px}
.trust{display:flex;gap:8px;align-items:center;color:var(--subtle);font-size:12px}

/* menu, dialog, toast */
.menu{position:fixed;z-index:300;min-width:220px;background:var(--surface);border:1px solid var(--stroke-strong);border-radius:8px;padding:4px;box-shadow:var(--shadow);animation:pop .15s var(--ease)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:5px}
.menu button:hover{background:var(--field)}
.menu button.d{color:var(--err)}
.menu hr{border:0;border-top:1px solid var(--stroke);margin:4px 2px}
.scrim{position:fixed;inset:0;z-index:400;background:#0006;backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--surface);border:1px solid var(--stroke-strong);border-radius:12px;padding:22px;width:min(420px,100%);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;animation:pop .25s var(--ease)}
.dlg h2{margin:0;font-size:18px;font-weight:600}
.dlg .who{padding:10px 12px;border-radius:8px;background:var(--field);border:1px solid var(--stroke);word-break:break-all}
.dlg .btns{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:28px;z-index:500;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:99px;box-shadow:var(--shadow);transition:all .35s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(340px,1fr) auto}
  .insp{border-left:0;border-top:1px solid var(--stroke)}
  .app{height:auto}
  .mapwrap{height:60vh}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>

<div class="app" id="app">
  <div class="title">
    <span class="dot"></span><span>USB Link · 磁碟空間</span><span class="sp"></span>
    <button class="ghost" id="theme" title="切換淺色／深色" aria-label="切換淺色或深色"><svg class="ic" viewBox="0 0 16 16"><path d="M8 2v1.5M8 12.5V14M2 8h1.5M12.5 8H14M3.8 3.8l1 1M11.2 11.2l1 1M12.2 3.8l-1 1M4.8 11.2l-1 1"/><circle cx="8" cy="8" r="2.6"/></svg></button>
  </div>

  <div class="bar" id="bar" hidden>
    <div class="nav">
      <button class="ghost" id="back" title="上一個位置" aria-label="上一個位置"><svg class="ic" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
      <button class="ghost" id="fwd" title="下一個位置" aria-label="下一個位置"><svg class="ic" viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
      <button class="ghost" id="up" title="上一層" aria-label="上一層"><svg class="ic" viewBox="0 0 16 16"><path d="M3 9l5-5 5 5M8 4v9"/></svg></button>
    </div>
    <div class="crumbs" id="crumbs" aria-label="目前位置"></div>
    <label class="search"><svg class="ic" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="m10.2 10.2 3.3 3.3"/></svg>
      <input id="q" placeholder="篩選：*.mp4  >100MB  type:影片  older:90d" aria-label="篩選條件" spellcheck="false" autocomplete="off">
      <button class="ghost x" id="qx" hidden aria-label="清除篩選"><svg class="ic" viewBox="0 0 16 16" style="width:12px;height:12px"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></label>
    <div class="seg" id="mode" role="group" aria-label="著色方式"><span class="pill"></span>
      <button data-m="type" aria-pressed="true">類型</button><button data-m="age" aria-pressed="false">修改時間</button></div>
    <label class="detail">細節<input type="range" id="detail" min="1" max="5" value="3" aria-label="細節程度"></label>
    <button class="btn" id="rescan"><svg class="ic" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3"/></svg>重新掃描</button>
    <div class="hint" id="hint"></div>
  </div>

  <div class="prog" id="prog" hidden><i></i></div>

  <section class="home" id="home">
    <div><h1>要分析哪裡的空間？</h1><p>以方塊面積呈現每個資料夾與檔案占用的空間。掃描只讀取檔名與大小，不會開啟檔案內容，也不會變更任何東西。</p></div>
    <div class="drives" id="drives"></div>

}

const USED=root.size,TOTAL=476*GB;let FREE=TOTAL-USED;

/* ---------- formatting ---------- */

/* ---------- squarified treemap (same algorithm as TreemapLayout in docs/DISK-USAGE.md) ---------- */
function squarify(items,x,y,w,h){
  const total=items.reduce((s,i)=>s+i.size,0),k=w*h/total,out=new Array(items.length);

  while(i<items.length){
    const side=Math.min(cw,ch);let row=[],rs=0,worst=Infinity,j=i;
    while(j<items.length){
      const a=items[j].size*k,nrs=rs+a,nr=row.concat(a),mx=Math.max(...nr),mn=Math.min(...nr);
      const nw=Math.max(side*side*mx/(nrs*nrs),nrs*nrs/(side*side*mn));
      if(row.length&&nw>worst)break;row=nr;rs=nrs;worst=nw;j++}
    const thick=rs/side;let off=0;
    row.forEach((a,t)=>{const len=a/thick;out[i+t]=cw>=ch?{x:cx,y:cy+off,w:thick,h:len}:{x:cx+off,y:cy,w:len,h:thick};off+=len});
    if(cw>=ch){cx+=thick;cw-=thick}else{cy+=thick;ch-=thick}i=j}
  return out}

    out.push({node:it,key:it.path,x:r.x,y:r.y,w:r.w,h:r.h,depth,hd:open});

/* ---------- filter ---------- */
const UNIT={b:1,kb:KB,mb:MB,gb:GB,tb:GB*1024},TU={h:36e5,d:864e5,w:6048e5,m:2592e6,y:31536e6};

function parseQ(t){
  t=t.trim();if(!t)return{pred:null};const preds=[];
  for(let term of t.split(/[\s;]+/).filter(Boolean)){
    let neg=false;if(term[0]==='!'){neg=true;term=term.slice(1)}
    const alts=term.split('|');let f;
    const one=a=>{let m;
      if(m=a.match(/^([<>]=?)(\d+(?:\.\d+)?)([a-z]*)$/i)){const u=UNIT[(m[3]||'b').toLowerCase()];if(!u)throw new Error('無法解讀大小：'+a);
        const v=+m[2]*u;return n=>n.kind==='file'&&(m[1]==='>'?n.size>v:m[1]==='>='?n.size>=v:m[1]==='<'?n.size<v:n.size<=v)}
      if(m=a.match(/^(older|newer):(\d+(?:\.\d+)?)([hdwmy])$/i)){const v=+m[2]*TU[m[3].toLowerCase()];return n=>n.kind==='file'&&(m[1].toLowerCase()==='older'?NOW-n.mod>v:NOW-n.mod<v)}

   ${top.length?`<div><h3 style="margin-bottom:6px">最大的項目</h3><div class="top">${top.map(t=>`<button class="row" style="--cat:var(--c-${t.cat});--w:${t.size/top[0].size*100}" data-p="${esc(t.path)}"><span class="nm">${esc(t.kind==='agg'?'小檔案':t.name)}</span><span class="sz num">${fs(t.size)}</span><span class="bar2"></span></button>`).join('')}</div></div>`:''}
   ${st.sel&&!st.sel.synthetic?`<div class="actions"><button class="btn" id="a-reveal">${IC.reveal}在檔案總管顯示</button>${st.sel.kind==='dir'?`<button class="btn" id="a-into">${IC.into}放大</button>`:''}<button class="btn" id="a-del" style="color:var(--err)">${IC.trash}移到資源回收筒</button></div>`:''}`;

  const d=$('#a-del');if(d)d.onclick=()=>askDelete(st.sel)}
function find(n,p){if(n.path===p)return n;if(n.kind!=='dir')return null;for(const k of n.kids){const r=find(k,p);if(r)return r}return null}

/* ---------- interaction ---------- */
function select(n){st.sel=n;if(n&&n.parent&&n.parent!==st.view&&!inView(n))go(n.parent);cells.forEach(c=>{const e=els.get(c.key);if(e)e.classList.toggle('sel',c.node===n)});renderInspector()}
function inView(n){for(let p=n.parent;p;p=p.parent)if(p===st.view)return true;return false}
function go(n,fromHist){if(!fromHist){st.hist.push(st.view);st.fwd=[]}st.view=n;if(st.sel&&!inView(st.sel)&&st.sel!==n)st.sel=null;render()}
map.addEventListener('click',e=>{const el=e.target.closest('.cell');if(!el||el._c.node.kind==='free'){select(null);return}select(el._c.node.synthetic?null:el._c.node)});
map.addEventListener('dblclick',e=>{const el=e.target.closest('.cell');if(el&&el._c.node.kind==='dir')go(el._c.node)});
map.addEventListener('mousemove',e=>{
  const el=e.target.closest('.cell');if(!el||!el._c){tip.classList.remove('on');return}
  const n=el._c.node;const name=n.kind==='agg'?(n.fold?fn(n.fold)+' 個較小的項目':'小檔案（合併顯示）'):n.kind==='free'?'可用空間':n.name;
  tip.style.setProperty('--cat',n.kind==='free'?'var(--stroke-strong)':'var(--c-'+n.cat+')');
  tip.innerHTML=`<div class="t"><i></i>${esc(name)}</div><dl><dt>大小</dt><dd class="num">${fs(n.size)}</dd><dt>占目前資料夾</dt><dd class="num">${pct(n.size,st.view.size)}</dd>${n.kind!=='free'?`<dt>${n.kind==='dir'?'檔案數':'檔案'}</dt><dd class="num">${fn(n.files)}</dd><dt>類型</dt><dd>${CAT[n.cat]}</dd><dt>最近修改</dt><dd>${ago(n.mod)}</dd>`:''}</dl>`;
  const x=Math.min(e.clientX+16,innerWidth-tip.offsetWidth-8),y=Math.min(e.clientY+16,innerHeight-tip.offsetHeight-8);
  tip.style.left=x+'px';tip.style.top=y+'px';tip.classList.add('on')});
map.addEventListener('mouseleave',()=>tip.classList.remove('on'));
map.addEventListener('contextmenu',e=>{
  const el=e.target.closest('.cell');if(!el)return;e.preventDefault();const n=el._c.node;if(n.kind==='free'||n.synthetic)return;
  select(n);closeMenu();const m=document.createElement('div');m.className='menu';m.id='menu';
  m.innerHTML=`<button data-a="reveal">${IC.reveal}在檔案總管顯示</button>${n.kind==='dir'?`<button data-a="into">${IC.into}放大到此資料夾</button><button data-a="scan">${IC.scan}重新掃描此資料夾</button>`:''}<button data-a="copy">${IC.copy}複製路徑</button><hr><button class="d" data-a="del">${IC.trash}移到資源回收筒…</button>`;
  document.body.appendChild(m);m.style.left=Math.min(e.clientX,innerWidth-m.offsetWidth-8)+'px';m.style.top=Math.min(e.clientY,innerHeight-m.offsetHeight-8)+'px';
  m.onclick=ev=>{const a=ev.target.closest('button')?.dataset.a;closeMenu();
    if(a==='reveal')toast('已在檔案總管顯示（原型不會真的開啟）');
    if(a==='into')go(n);if(a==='copy'){try{navigator.clipboard.writeText(n.path)}catch{}toast('已複製路徑')}
    if(a==='scan')toast('已重新掃描 '+n.name);if(a==='del')askDelete(n)}});
const closeMenu=()=>$('#menu')?.remove();
addEventListener('click',closeMenu);addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeMenu();$('.scrim')?.remove();if(st.sel)select(null)}
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Backspace'||(e.altKey&&e.key==='ArrowUp')){if(st.view.parent)go(st.view.parent)}
  if(e.altKey&&e.key==='ArrowLeft')$('#back').click();if(e.altKey&&e.key==='ArrowRight')$('#fwd').click();
  if(e.key==='Delete'&&st.sel&&!st.sel.synthetic)askDelete(st.sel)});
$('#back').onclick=()=>{if(st.hist.length){st.fwd.push(st.view);go(st.hist.pop(),true)}};
$('#fwd').onclick=()=>{if(st.fwd.length){st.hist.push(st.view);go(st.fwd.pop(),true)}};
$('#up').onclick=()=>{if(st.view.parent)go(st.view.parent)};
$('#q').oninput=e=>{try{const r=parseQ(e.target.value);st.pred=r.pred;st.qerr=''}catch(err){st.pred=null;st.qerr=err.message}
  $('#qx').hidden=!e.target.value;mcache.clear();render()};
$('#qx').onclick=()=>{$('#q').value='';$('#q').oninput({target:$('#q')})};
$('#detail').oninput=e=>{st.detail=+e.target.value;render()};
function moveSeg(){const seg=$('#mode'),b=seg.querySelector('[aria-pressed="true"]'),p=seg.querySelector('.pill');p.style.left=b.offsetLeft+'px';p.style.width=b.offsetWidth+'px'}
$('#mode').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.mode=b.dataset.m;$('#mode').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));moveSeg();render()};
$('#theme').onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark'};
new ResizeObserver(()=>{if(st.tree&&!$('#main').hidden)render()}).observe(map);

function askDelete(n){
  const s=document.createElement('div');s.className='scrim';
  s.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-label="移到資源回收筒"><h2>移到資源回收筒？</h2>
   <div class="who"><b>${esc(n.name)}</b><br><span style="color:var(--muted)">${esc(n.path)}</span><br><span class="num">${fs(n.size)}${n.kind==='dir'?' · '+fn(n.files)+' 個檔案':''}</span></div>
   <div style="color:var(--muted)">可以從資源回收筒還原。不會永久刪除。</div>
   <div class="btns"><button class="btn" id="no">取消</button><button class="btn danger" id="yes">移到資源回收筒</button></div></div>`;
  document.body.appendChild(s);s.querySelector('#no').focus();
  s.onclick=e=>{if(e.target===s)s.remove()};s.querySelector('#no').onclick=()=>s.remove();
  s.querySelector('#yes').onclick=()=>{s.remove();removeNode(n)}}
function removeNode(n){
  const p=n.parent;if(!p)return;p.kids=p.kids.filter(k=>k!==n);
  for(let a=p;a;a=a.parent){a.size-=n.size;a.files-=n.files}FREE+=n.size;
  if(st.view===n)st.view=p;if(st.sel===n)st.sel=null;mcache.clear();render();toast('已移到資源回收筒 · 釋放 '+fs(n.size))}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}

/* ---------- scan simulation: tree grows live, as CaptureSnapshot would deliver it ---------- */
function partial(n,limit,fr){
  if(n.kind!=='dir'){if(n.off>=limit)return null;fr.add(n);return{...n,size:Math.min(n.size,limit-n.off)}}
  const kids=[];let size=0,files=0,mm=0;const best={};
  for(const k of n.kids){const c=partial(k,limit,fr);if(c){kids.push(c);size+=c.size;files+=c.files*(c.size/(k.size||1));mm=Math.max(mm,c.mod);best[c.cat]=(best[c.cat]||0)+c.size}}
  if(!kids.length)return null;
  const o={...n,kids,size,files:Math.round(files),mod:mm,cat:Object.keys(best).sort((a,b)=>best[b]-best[a])[0]};kids.forEach(k=>k.parent=o);return o}
let raf=0,t0=0;
function startScan(){
  $('#home').hidden=true;['#bar','#main','#status','#prog'].forEach(s=>$(s).hidden=false);moveSeg();
  st.scanning=true;st.sel=null;st.hist=[];st.fwd=[];st.cats.clear();st.pred=null;$('#q').value='';t0=performance.now();cancelAnimationFrame(raf);$('#prog').hidden=false;$('#prog i').style.opacity=1;$('#prog i').style.width='0%';
  $('#rescan').disabled=true;let last=0;
  const DUR=5200,full=root0;
  const tick=now=>{
    const p=Math.min(1,(now-t0)/DUR),e=1-Math.pow(1-p,1.6);
    if(now-last>230||p===1){last=now;
      const fr=new Set();const t=p>=1?full:partial(full,Math.max(USED*e,MB),fr);if(!t){raf=requestAnimationFrame(tick);return}t.parent=null;
      const wasRoot=!st.view||st.view===st.tree;st.tree=t;st.view=t;
      st.frontier=new Set();if(p<1){for(const f of fr){}let lastF=null;fr.forEach(f=>lastF=f);for(let a=lastF?.parent;a;a=a.parent){const orig=find(t,a.path);if(orig)st.frontier.add(orig)}
        $('#st-path').textContent=lastF?'正在讀取 '+lastF.path:''}else st.frontier=new Set();
      $('#prog i').style.width=(e*100)+'%';
      $('#st-files').textContent=fn(FAKE_FILES*e)+' 個檔案';$('#st-size').textContent=fs(USED*e);
      $('#st-time').textContent=((now-t0)/1000).toFixed(1)+' 秒';
      st.p=p;render()}
    if(p<1)raf=requestAnimationFrame(tick);else done()};
  raf=requestAnimationFrame(tick)}
function done(){
  st.scanning=false;$('#rescan').disabled=false;$('#st-path').textContent='';$('#prog i').style.opacity=0;
  setTimeout(()=>{$('#prog').hidden=true;$('#prog i').style.opacity=1},500);
  $('#st-time').textContent='耗時 5.2 秒';render();toast('掃描完成 · '+fn(FAKE_FILES)+' 個檔案 · '+fs(USED))}
$('#rescan').onclick=()=>{ $('#prog').hidden=false; resetTree(); startScan() };
function resetTree(){}

/* ---------- home ---------- */
$('#drives').innerHTML=[
  ['C:','本機磁碟 · NTFS',TOTAL,USED,'drive',1],['D:','USB 隨身碟 · exFAT',256*GB,181*GB,'usb',1],['E:','資料 · NTFS',1024*GB,421*GB,'drive',1]].map(([n,sub,t,u,ic],i)=>
  `<button class="drive" style="--i:${i}" data-d="${n}"><div class="top2"><div class="glyph">${IC[ic]}</div><div><div class="nm">${n}</div><div class="sub">${sub}</div></div></div>
   <div class="meter"><i class="${u/t>.85?'warn':''}" style="width:${u/t*100}%"></i></div><div class="nums num"><span>已用 ${fs(u)}</span><span>共 ${fs(t)}</span></div></button>`).join('')
 +`<button class="drive pick" style="--i:3" data-d="pick">${IC.plus}<span>選擇資料夾…</span></button>`;
$('#drives').onclick=e=>{const b=e.target.closest('.drive');if(b)startScan()};
moveSeg();
</script>
